name: Trade-bot tick

# Strategie: GitHub Actions cron heeft hard minimum van 5 minuten tussen runs.
# Workaround: per run draaien we 5 ticks van 60s ertussen = effectief elke minuut
# tikken zonder onder het cron minimum te zakken. Concurrency-group voorkomt overlap
# als een run uitloopt.
#
# Tijdsbudget: 5 ticks × ~3s + 4 × 60s sleep = ~195s + 30-40s install = ~4 min totaal.
# GH Actions minutes: public repo = unlimited, dus geen quota-probleem.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:  # handmatig triggerbaar via GitHub UI

concurrency:
  group: bot-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime deps (geen FastAPI/anthropic nodig voor tick-only)
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy python-dotenv supabase pydantic httpx

      - name: Run 5 bot-ticks met 60s interval
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:    ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ENV:                  paper
          EXCHANGE:             bitvavo
        run: python -m engine.bot --interval 60 --max-ticks 5
